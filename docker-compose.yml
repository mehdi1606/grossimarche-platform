# =====================================================================================
# Grossimarché — full platform, one command. Backend + storefront + back-office behind a
# single nginx gateway. Only the proxy is published; Postgres, Redis, backend, store and
# admin all stay on the private network.
#
#   Storefront   http://<host>/
#   Back-office  http://<host>/admin/
#   API          http://<host>/api/v1/...
#
# The published port and the public origin come from the root .env (PUBLIC_PORT,
# PUBLIC_ORIGIN). PUBLIC_ORIGIN must match how visitors actually reach the site — it is what
# CORS is checked against, what NextAuth signs callbacks with, and what customer e-mails link
# to. Set it to the server's address before the first start.
#
#   docker compose up -d --build
#
# Build contexts are the three project folders (siblings of this deploy folder).
# =====================================================================================
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: grossimarche
      POSTGRES_USER: grossimarche
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grossimarche}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grossimarche -d grossimarche"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted machine translation (FR -> AR/EN) for the storefront. Only en/fr/ar models are
  # loaded to keep the image lean; the first startup still downloads those Argos models (can
  # take several minutes) into the persistent lt_models volume. Translation is best-effort, so
  # the backend does not hard-depend on it being ready.
  libretranslate:
    image: libretranslate/libretranslate:latest
    # Run as root so the service can write models into the (root-owned) named volume; the
    # image's default user cannot, which crashes it with a PermissionError on first boot.
    user: root
    environment:
      LT_LOAD_ONLY: "en,fr,ar"
    volumes:
      - lt_models:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages').getcode()==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s

  backend:
    build:
      context: ./backend
    environment:
      # 'local' is demo-ready: it loads the seed catalogue and generates a throwaway JWT
      # signing key at startup — which means every session is invalidated whenever the
      # backend restarts. Fine for a demo, wrong for a shop with real customers.
      #
      # 'prod' needs a persistent RSA key pair (JWT_PRIVATE_KEY / JWT_PUBLIC_KEY) and reads
      # the database and Redis from the DB_* / REDIS_* names below. Both naming schemes are
      # provided, so switching profile is a one-line change in .env once the keys exist.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grossimarche
      SPRING_DATASOURCE_USERNAME: grossimarche
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-grossimarche}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Same values under the names the 'prod' profile expects.
      DB_URL: jdbc:postgresql://postgres:5432/grossimarche
      DB_USERNAME: grossimarche
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      API_PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      # OTP delivery. 'smtp' sends the e-mail codes through the SMTP account below; SMS
      # codes stay in the backend log. Credentials live in the (gitignored) root .env —
      # see .env.example. Without a .env this falls back to log-only codes.
      OTP_PROVIDER: ${OTP_PROVIDER:-logging}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Grossimarché}
      # Links inside e-mails. These are absolute and cannot be derived from the request, so
      # they must be set in .env to the public origin — otherwise every invitation and every
      # order-tracking link points at localhost.
      ADMIN_URL: ${ADMIN_URL:-http://localhost/admin}
      # The storefront, for the tracking and offer links in customer e-mails.
      STORE_URL: ${STORE_URL:-http://localhost}
      # First back-office account, created on startup so a fresh database is never locked out.
      # Override BOOTSTRAP_ADMIN_PASSWORD in the root .env before exposing this deployment.
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-houarimehdi7@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@123}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Mehdi Houari}
      # Product images: written to the shared `uploads` volume, served same-origin by the
      # gateway at /files/ (so the stored URL is relative and works from any host).
      STORAGE_DIRECTORY: /app/data/uploads
      STORAGE_PUBLIC_BASE_URL: /files
      # Machine translation (LibreTranslate). Best-effort — source text is returned if it's down.
      GROSSIMARCHE_TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-true}
      GROSSIMARCHE_TRANSLATION_URL: http://libretranslate:5000
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  store:
    build:
      context: ./store-without-stripe
    environment:
      NODE_ENV: production
      # Browser uses the same-origin gateway path (baked at build). Server-side rendering
      # and NextAuth call the backend directly over the private network.
      INTERNAL_API_URL: http://backend:8080/api/v1
      NEXTAUTH_URL: ${PUBLIC_ORIGIN:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please-change-me-32-chars-minimum-secret}
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
    depends_on:
      - backend

  proxy:
    build:
      context: ./proxy
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      # Read-only view of the images the backend uploads; nginx serves them at /files/.
      - uploads:/usr/share/nginx/files:ro
    depends_on:
      - store
      - admin
      - backend

volumes:
  pgdata:
  redisdata:
  uploads:
  lt_models:
