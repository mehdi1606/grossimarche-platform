# Launcher icons, generated from assets/icon/ by `dart run flutter_launcher_icons`.
#
# The sources are rebuilt from the brand's app icon: it was a JPEG with rounded corners baked
# in on white, which Android's own mask (circle, squircle, teardrop...) would have shown as
# white corners. The mark is separated from its ground so every launcher shape gets a clean
# icon, and kept inside the 72dp disc that is all a round launcher shows of the 108dp layer.
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A6A45"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

  ios: true
  # The App Store refuses an icon with an alpha channel.
  remove_alpha_ios: true
