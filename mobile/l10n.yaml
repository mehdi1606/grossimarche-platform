# The app's own words, in French (the source) and Arabic. `flutter gen-l10n` - run by every
# `flutter run` / `flutter build` - turns lib/l10n/app_*.arb into AppLocalizations.
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
