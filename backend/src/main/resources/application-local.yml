# Local development profile. Points at the docker-compose Postgres and Redis.
# Credentials are hardcoded here (and mirrored in docker-compose.yml) - they are
# non-secret local dev values, and pinning them avoids any env-var mismatch between the
# app and the container. Ports are offset from the usual 5432/6379 to avoid clashes.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/grossimarche
    username: grossimarche
    password: grossimarche
  data:
    redis:
      host: localhost
      port: 6380
  # Demo data is NOT loaded. db/seed still holds it (V2 catalogue, V4 coupons) but the
  # location is deliberately left out: this is a real shop, and its catalogue is the one the
  # merchant enters, not four invented stores and a handful of sample products that reappear
  # at every reset.
  #
  # Re-adding `,classpath:db/seed` here also fails Flyway validation on any database that was
  # created without it - and the reverse. Change it only against a fresh volume.
  flyway:
    locations: classpath:db/migration

# Full health detail locally so `GET /actuator/health` shows db + redis components.
management:
  endpoint:
    health:
      show-details: always
      show-components: always

# Swagger UI reachable at /swagger-ui.html in local only.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

grossimarche:
  jwt:
    # No RS256 key configured locally → generate a throwaway one at startup.
    allow-ephemeral-key: true

logging:
  level:
    com.grossimarche: DEBUG
