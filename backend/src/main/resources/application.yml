# Shared configuration for all profiles. Environment-specific values and all secrets are
# set per-profile below / from env vars (see .env.example). The active profile defaults
# to "local" for developer convenience; production must set SPRING_PROFILES_ACTIVE=prod.
spring:
  application:
    name: grossimarche
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    # Flyway owns the schema; Hibernate only validates entities against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Map java.time.Instant to `timestamp with time zone` so entities validate
        # against the timestamptz columns Flyway creates.
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Boot defaults to 1MB per file, which rejects an ordinary product photo before the
      # service ever sees it. Kept in step with grossimarche.storage.max-file-size-bytes (5MB).
      max-file-size: 5MB
      max-request-size: 6MB
  # Outbound SMTP, used when grossimarche.otp.provider=smtp. Credentials come from the
  # environment only (see .env.example) - Gmail requires an App Password, never the
  # account password, and 2-Step Verification must be on for the account.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # 15s rather than 5s: a cold STARTTLS handshake to Gmail from a VPS regularly needs
          # more than five seconds, and a timeout looks identical to a rejected password from
          # the back-office side.
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  # Jackson 3 (shipped with Boot 4) already serialises java.time as ISO-8601 by default.
  # Null-omission is applied per-DTO via @JsonInclude where wanted.

server:
  port: ${SERVER_PORT:8080}

# Trace id (set by RequestTraceFilter) is stamped on every log line.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# Actuator: only health is exposed here; the rest is locked down (opened to ADMIN in B3).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true

# API docs are off by default; enabled only in the local profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Resilience for outbound OTP delivery (only exercised by the live senders).
resilience4j:
  retry:
    instances:
      otp-sms:
        max-attempts: 3
        wait-duration: 500ms
      otp-email:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      otp-sms:
        sliding-window-size: 10
        failure-rate-threshold: 50
      otp-email:
        sliding-window-size: 10
        failure-rate-threshold: 50

grossimarche:
  pricing:
    # Delivery: per-city rates for the area actually served, the flat fee for anywhere else,
    # and free delivery above the threshold whatever the city. Keys are lowercase, unaccented.
    delivery-fee: ${DELIVERY_FEE:30.00}
    free-delivery-threshold: ${FREE_DELIVERY_THRESHOLD:1000.00}
    city-fees:
      mohammedia: 0.00
      casablanca: 20.00
      benslimane: 30.00
  api:
    public-url: ${API_PUBLIC_URL:http://localhost:8080}
  # Where the back-office lives. Used for the "se connecter" link in the staff invitation email.
  admin-url: ${ADMIN_URL:http://localhost:4100}
  # Where the storefront lives. Used for the tracking and offer links in customer e-mails.
  store-url: ${STORE_URL:http://localhost:3000}
  # The owner's back-office account, created on first start so a fresh database is never locked
  # out (staff accounts can only be created by an existing ADMIN, and there is no public
  # sign-up). A password is only ever set on an account that has none, so a restart cannot
  # reset a password that has since been changed.
  #
  # IMPORTANT: set BOOTSTRAP_ADMIN_PASSWORD anywhere that is not a local machine. The default
  # below is a first-run convenience so the back-office is reachable out of the box - it is not
  # a production secret, and it should be changed from the account's own password screen.
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    email: ${BOOTSTRAP_ADMIN_EMAIL:houarimehdi7@gmail.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Mehdi Houari}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    issuer: ${JWT_ISSUER:https://api.grossimarche.ma}
    key-id: ${JWT_KEY_ID:grossimarche-key-1}
    # PEM contents (not file paths). Empty locally → an ephemeral dev key is generated.
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Overridden to true only in local/test so dev works without configured keys.
    allow-ephemeral-key: false
  storage:
    # Uploaded product images. Under docker-compose these point at the shared `uploads`
    # volume and at a relative URL, so the gateway serves the files same-origin at /files/.
    directory: ${STORAGE_DIRECTORY:./data/uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
  otp:
    # 'logging' writes the code to the DEBUG log (dev); 'live' uses the HTTP providers;
    # 'smtp' sends e-mail codes through spring.mail.* (SMS stays on the log).
    provider: ${OTP_PROVIDER:logging}
    email:
      # Empty → the SMTP sender falls back to the authenticated mailbox (what Gmail wants).
      from: ${MAIL_FROM:}
      from-name: ${MAIL_FROM_NAME:Grossimarché}
