# Grossimarché gateway — one public door in front of all three services.
#   /api  /ws   -> backend (Spring Boot)
#   /admin      -> admin  (Vite SPA, static)
#   /           -> store  (Next.js SSR)
# Same-origin routing means the frontends call /api/v1 with no CORS preflight.

upstream gm_backend { server backend:8080; }
upstream gm_store   { server store:3000; }
upstream gm_admin   { server admin:80; }

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  # ---- NextAuth routes belong to the STORE, not the backend. This longer prefix wins over
  #      /api/ below (nginx picks the longest matching prefix). The backend REST API lives at
  #      /api/v1/*, so it is unaffected. Without this, /api/auth/* hits the backend and 401s. ----
  location /api/auth/ {
    proxy_pass http://gm_store;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- REST API (path preserved: /api/v1/... reaches the backend unchanged) ----
  location /api/ {
    proxy_pass http://gm_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- WebSocket (STOMP / SockJS order tracking) ----
  location /ws/ {
    proxy_pass http://gm_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # ---- Uploaded files (product images). Written by the backend into the shared `uploads`
  #      volume; served straight from disk here so the browser gets them same-origin. ----
  location /files/ {
    alias /usr/share/nginx/files/;
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
  }

  # ---- Admin SPA (matches /admin and /admin/*) ----
  location /admin {
    proxy_pass http://gm_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Storefront (Next.js SSR) — catch-all, last ----
  location / {
    proxy_pass http://gm_store;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
