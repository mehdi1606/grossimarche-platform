# Market Food gateway - one public door in front of all three services.
#   /api  /ws   -> backend (Spring Boot)
#   /admin      -> admin  (Vite SPA, static)
#   /           -> store  (Next.js SSR)
# Same-origin routing means the frontends call /api/v1 with no CORS preflight.

# ---- Why there are no `upstream` blocks here ----
# nginx resolves a hostname written in an `upstream` (or in a literal proxy_pass) exactly once,
# when it loads its configuration, and caches that address for the life of the process. Docker
# hands a container a new IP every time it is recreated, so rebuilding the storefront and the
# back-office made them swap addresses while this proxy - untouched, and therefore not reloaded -
# kept sending admin traffic to the store's IP and vice versa: connection refused, 502 on every
# page, with both containers perfectly healthy.
#
# Naming the service in a variable defers the lookup to request time, against Docker's embedded
# DNS at 127.0.0.11, re-checked every 10 seconds. A rebuilt container is picked up on its own.
# (The variables carry no path, so nginx forwards the original URI unchanged - same routing as
# the literal form it replaces.)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  set $gm_backend http://backend:8080;
  set $gm_store   http://store:3000;
  set $gm_admin   http://admin:80;

  # ---- NextAuth routes belong to the STORE, not the backend. This longer prefix wins over
  #      /api/ below (nginx picks the longest matching prefix). The backend REST API lives at
  #      /api/v1/*, so it is unaffected. Without this, /api/auth/* hits the backend and 401s. ----
  location /api/auth/ {
    proxy_pass $gm_store;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- REST API (path preserved: /api/v1/... reaches the backend unchanged) ----
  location /api/ {
    proxy_pass $gm_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- WebSocket (STOMP / SockJS order tracking) ----
  location /ws/ {
    proxy_pass $gm_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # ---- Uploaded files (product images). Written by the backend into the shared `uploads`
  #      volume; served straight from disk here so the browser gets them same-origin. ----
  location /files/ {
    alias /usr/share/nginx/files/;
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
  }

  # ---- Admin SPA (matches /admin and /admin/*) ----
  location /admin {
    proxy_pass $gm_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Storefront (Next.js SSR) - catch-all, last ----
  location / {
    proxy_pass $gm_store;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
